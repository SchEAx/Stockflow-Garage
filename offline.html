<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <title>GarageFlow | Bağlantı Yok</title>
  <style>
    *{box-sizing:border-box}body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 0,#153b68,#07111f 55%);color:#f6f8fb;font-family:Inter,system-ui,sans-serif}.card{width:min(460px,100%);padding:28px;border:1px solid #2f5480;border-radius:24px;background:#0d1b2d;box-shadow:0 25px 70px #0008;text-align:center}.card img{width:112px;height:112px;padding:10px;border-radius:26px;background:#07111f;object-fit:contain}.card h1{margin:18px 0 8px;font-size:27px}.card p{margin:0;color:#afc0d4;line-height:1.55}.card button{width:100%;margin-top:20px;padding:13px;border:1px solid #78a9ff;border-radius:13px;background:#4c8dff;color:#fff;font-weight:900;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="GarageFlow" />
    <h1>İnternet bağlantısı yok</h1>
    <p>GarageFlow kabuğu açıldı ancak canlı kayıt ve Supabase işlemleri için bağlantı gerekiyor.</p>
    <button type="button" onclick="location.reload()">Tekrar Dene</button>
  </main>
</body>
</html>
